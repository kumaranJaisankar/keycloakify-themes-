        <path class="rcip-emblem-dot" d="M 315.84,240.3 L 315.84,252.15 L 327.1,252.15 L 326.5,239.71 Z" />
        <path class="rcip-emblem-dot" d="M 296.88,240.3 L 296.88,252.15 L 308.14,252.15 L 307.55,239.71 Z" />
    </g>
</svg>
