<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
    <defs>
        <style>
            :root {
                --badge-bg: url(#badgeGradLight);
                --badge-stroke: rgba(0, 59, 112, 0.15);
                --badge-stroke-width: 2px;
                --emblem-primary: #FFFFFF;
                --emblem-cyan: #00E5FF;
                --emblem-secondary: #E0F2FE;
                --emblem-stripe: #38BDF8;
                --emblem-dot: #00E5FF;
                --emblem-shadow: rgba(0, 0, 0, 0.25);
            }

            .rcip-badge {
                fill: var(--badge-bg);
                stroke: var(--badge-stroke);
                stroke-width: var(--badge-stroke-width);
                transition: all 0.3s ease;
            }

            .rcip-emblem-primary { fill: var(--emblem-primary); }
            .rcip-emblem-cyan { fill: var(--emblem-cyan); }
            .rcip-emblem-secondary { fill: var(--emblem-secondary); opacity: 0.9; }
            .rcip-emblem-stripe { fill: var(--emblem-stripe); }
            .rcip-emblem-dot { fill: var(--emblem-dot); }

            /* Dark Theme Mode (Browser tab in dark theme) */
            @media (prefers-color-scheme: dark) {
                :root {
                    --badge-bg: url(#badgeGradDark);
                    --badge-stroke: rgba(255, 255, 255, 0.35);
                    --badge-stroke-width: 6px;
                    --emblem-primary: #FFFFFF;
                    --emblem-cyan: #38BDF8;
                    --emblem-secondary: #F0F9FF;
                    --emblem-stripe: #7DD3FC;
                    --emblem-dot: #38BDF8;
                }
            }
        </style>

        <!-- Badge Background Gradients -->
        <linearGradient id="badgeGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0066CC" />
            <stop offset="50%" stop-color="#004499" />
            <stop offset="100%" stop-color="#002255" />
        </linearGradient>

        <linearGradient id="badgeGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0284C7" />
            <stop offset="50%" stop-color="#0369A1" />
            <stop offset="100%" stop-color="#0C4A6E" />
        </linearGradient>

        <!-- Subtle drop shadow filter for 3D depth -->
        <filter id="emblemShadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
        </filter>
    </defs>

    <!-- High-Contrast Squircle Badge Background -->
    <rect class="rcip-badge" x="12" y="12" width="488" height="488" rx="108" ry="108" />

    <!-- RCIP Emblem -->
