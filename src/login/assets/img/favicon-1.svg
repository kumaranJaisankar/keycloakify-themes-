        <path class="rcip-emblem-stripe" d="M 155.87,343.98 L 155.87,348.72 L 158.24,351.09 L 202.09,351.09 L 203.86,349.91 L 204.45,343.39 L 202.68,341.61 L 158.83,341.61 Z" />
        <path class="rcip-emblem-dot" d="M 296.88,220.16 L 297.47,232.6 L 308.14,232.0 L 308.14,220.16 Z" />
