<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
    <defs>
        <style>
            :root {
                --badge-bg: url(#badgeGradLight);
                --badge-stroke: rgba(255, 255, 255, 0.4);
                --badge-stroke-width: 6px;
                --emblem-white: #FFFFFF;
                --emblem-cyan: #00E5FF;
                --emblem-sky: #7DD3FC;
                --emblem-light-blue: #38BDF8;
            }

            .rcip-badge {
                fill: var(--badge-bg);
                stroke: var(--badge-stroke);
                stroke-width: var(--badge-stroke-width);
            }

            .emblem-white { fill: var(--emblem-white); }
            .emblem-cyan { fill: var(--emblem-cyan); }
            .emblem-sky { fill: var(--emblem-sky); }
            .emblem-light-blue { fill: var(--emblem-light-blue); }

            /* Dark Mode Theme */
            @media (prefers-color-scheme: dark) {
                :root {
                    --badge-bg: url(#badgeGradDark);
                    --badge-stroke: rgba(255, 255, 255, 0.6);
                    --badge-stroke-width: 8px;
                    --emblem-white: #FFFFFF;
                    --emblem-cyan: #38BDF8;
                    --emblem-sky: #BAE6FD;
                    --emblem-light-blue: #7DD3FC;
                }
            }
        </style>

        <linearGradient id="badgeGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0066CC" />
            <stop offset="50%" stop-color="#004499" />
            <stop offset="100%" stop-color="#002255" />
        </linearGradient>

        <linearGradient id="badgeGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0284C7" />
            <stop offset="50%" stop-color="#0369A1" />
            <stop offset="100%" stop-color="#0C4A6E" />
        </linearGradient>

        <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
        </filter>
    </defs>

    <!-- High-Contrast Squircle Badge -->
    <rect class="rcip-badge" x="16" y="16" width="480" height="480" rx="104" ry="104" />

